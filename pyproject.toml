[project]
name = "cadvae"
version = "0.1.0"
description = "Construct-Aligned Disentangled VAE (CA-DVAE) for interpretable, business-aligned buyer personas"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # torch pinned exactly; served from the CUDA 12.4 index (see [tool.uv] below).
    # cu124 chosen over cu126/cu128 for wider driver tolerance on the RTX 4050 laptop.
    "torch==2.6.0",
    "polars>=1.21,<2",
    "scikit-learn>=1.6,<2",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19",
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.3,<2.4",
    "matplotlib>=3.10,<4",
    "scipy>=1.15,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.uv]
# Fixed hardware target (Windows laptop, RTX 4050). Restricting resolution
# environments keeps the lockfile focused and avoids resolving mac/linux trees
# that this project will never run on.
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadvae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# CLAUDE.md verification cadence: basic-mode type check on src/ only;
# no heavy stubs for NumPy-heavy code.
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
