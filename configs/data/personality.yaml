# Dataset A — Customer Personality Analysis
# Kaggle: imakash3011/customer-personality-analysis
# Role in the paper: interpretability story (rich demographics + campaign response).
name: personality
raw_path: data/raw/customer_personality/marketing_campaign.csv
processed_dir: data/processed/personality
separator: "\t"           # verified tab-separated (data card A)
label: Response           # primary downstream task = campaign response (D-014)

split:
  type: stratified        # mandated by CLAUDE.md — guarded by tests/test_config.py
  # Phase 1 decision D-014 (owner-delegated 2026-07-09). Consequential values
  # locked here and asserted in tests/test_config.py so they cannot drift silently.
  test_size: 0.2
  val_size: 0.2           # of the full dataset (train = 0.6)
  stratify_on: Response

# Cleaning + feature engineering policy — D-013 (all fits are TRAIN-ONLY).
preprocess:
  reference_year: 2014            # Age = reference_year - Year_Birth
  tenure_reference: "2015-01-01"  # Customer_Tenure_Days = tenure_reference - Dt_Customer
  dt_customer_format: "%d-%m-%Y"  # verified DD-MM-YYYY (data card A)
  winsor_lower_q: 0.01            # train-fit quantiles for Income, Age
  winsor_upper_q: 0.99
  drop_columns: [ID, Year_Birth, Dt_Customer, Z_CostContact, Z_Revenue]
  marital_status_junk: [Absurd, YOLO, Alone]   # → "Other"
  marital_status_other: Other
  numeric_impute: median          # train median (only Income has nulls)
  standardize: true               # z-score on train mean/std (VAE needs it)

# Named marketing constructs — alignment-head targets (D-018). Train-only standardized.
constructs:
  rfm:
    recency: Recency
    frequency_cols: [NumDealsPurchases, NumWebPurchases, NumCatalogPurchases, NumStorePurchases]
    monetary_cols: [MntWines, MntFruits, MntMeatProducts, MntFishProducts, MntSweetProducts, MntGoldProds]
  price_sensitivity: deal_reliance   # NumDealsPurchases / total purchases (discount-seeking)
  affinity_cols: [MntWines, MntFruits, MntMeatProducts, MntFishProducts, MntSweetProducts, MntGoldProds]
