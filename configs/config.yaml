# Root Hydra config. Every experiment is fully defined by the composed,
# resolved config; runs write it (plus config hash, git commit, seed) to
# results/ via cadvae.utils.run_logging.
#
# Compose examples (entrypoints arrive in later phases):
#   data=ecommerce model=ae seed=13
defaults:
  - data: personality
  - model: cadvae
  - _self_

seed: 7
device: cuda          # CPU fallback must be explicit (device=cpu), never silent
results_dir: results
run_name: ${model.name}_${data.name}_seed${seed}

# Evaluation protocol (Phase 3, D-019/D-020; D-023 six seeds). Frozen-rep downstream lift.
eval:
  seeds: [0, 1, 2, 3, 4, 5]   # 6 seeds (D-023): Wilcoxon p-floor 2^-(n-1)=0.03125 < 0.05,
                              # so BOTH paired tests can carry headline significance
  n_clusters: 8               # K for segmentation baselines (D-020)
  train_subsample: null       # cap on train users for rep/head fitting; B overrides (D-020)
  k_frac: 0.10                # precision@k targeting fraction
  primary_metric: pr_auc      # imbalanced labels → PR-AUC is the headline
  methods: null               # null = all baselines; subset list for partial runs (D-024)

# Phase-5 CA-DVAE sweep grid (D-029). beta swept DOWN from 1 (sanity runs showed
# kl_free ~0.02 at beta=1 -> free dims collapsed); lambda=0 column = pure beta-VAE
# ablation, beta=1 row = VAE+align ablation (D-022 config points).
sweep:
  betas: [0.05, 0.1, 0.25, 0.5, 1.0, 2.0]
  lambdas: [0.0, 0.25, 1.0, 4.0]

# Phase-6 analysis (D-030 stability protocol, D-031 sweet-spot rule, D-032 cards).
phase6:
  head: gbt                   # downstream head used for curve/tables
  x_metric: mig_mean          # trade-off x-axis (r2 variant is always emitted too)
  y_slack: null               # null -> the best point's own seed-std (D-031)
  stability_users: 50000      # fixed seed-independent user sample (D-030); A uses all
  stability_seed: 20260710    # RNG for the user sample — NOT a model seed
  n_boot: 20                  # bootstrap-persistence resamples
  traversal_span: 2.0         # persona-card traversal, prior units (+/-)
  card_top_features: 8

# Phase-7 reproduction check (re-run one pinned seed, diff vs recorded records.json).
repro:
  seed: 0
  atol: 1.0e-9                # D-028 bit-reproducible on this machine; loosen cross-machine
  rtol: 0.0

hydra:
  run:
    dir: ${results_dir}/runs/${now:%Y-%m-%d_%H-%M-%S}_${run_name}
  sweep:
    dir: ${results_dir}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}_${run_name}
  job:
    chdir: false
